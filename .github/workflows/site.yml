name: Build and deploy site

# One workflow owns the site: it pulls new draws, commits data/, builds _site/ and deploys it to GitHub Pages.
# Draws happen Saturday ~20:35 KST; the schedule runs Sunday 09:17 KST (00:17 UTC).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache font
        uses: actions/cache@v6
        with:
          path: .cache
          key: font-${{ hashFiles('scripts/build.py') }}

      - run: pip install -r requirements.txt

      - name: Fetch latest draws and rebuild
        run: python scripts/build.py --update

      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then
            echo "No changes to commit."
            exit 0
          fi
          latest=$(python -c "import json; print(max(d['draw_no'] for d in json.load(open('data/all.json'))))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update draws through #${latest}"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
