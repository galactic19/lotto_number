name: Weekly draw update

# Draws happen Saturday ~20:35 KST. Run Sunday 09:17 KST (00:17 UTC) so the data source has caught up,
# and allow a manual run from the Actions tab.
on:
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache font
        uses: actions/cache@v6
        with:
          path: .cache
          key: font-${{ hashFiles('scripts/build.py') }}

      - run: pip install -r requirements.txt

      - name: Fetch latest draws and rebuild
        run: python scripts/build.py --update

      - name: Commit if changed
        run: |
          if git diff --quiet -- data index.html; then
            echo "No new draw."
            exit 0
          fi
          latest=$(python -c "import json; print(max(d['draw_no'] for d in json.load(open('data/all.json'))))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "Update draws through #${latest}"
          git push
